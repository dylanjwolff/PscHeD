[package]
name = "rsched-preload"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsched_preload"
# cdylib only: this is the LD_PRELOAD shim that exports the real pthread names.
crate-type = ["cdylib"]
test = false

[features]
# Propagate TSAN annotation support to the rsched crate.
tsan = ["rsched/tsan"]
asan = ["rsched/asan"]
coro = ["rsched/coro"]

[dependencies]
rsched = { path = ".." }
libc = "0.2"
scopeguard = "1"

[dev-dependencies]
cc = "1"
