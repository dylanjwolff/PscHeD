[package]
name = "rsched"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsched"
# rlib    – used by integration tests (Rust calls into our no_mangle exports)
# staticlib – C programs that statically link against librsched.a
# cdylib  – LD_PRELOAD / dynamic-link use
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
