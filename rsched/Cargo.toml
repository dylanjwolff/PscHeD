[workspace]
members = [".", "preload"]

[package]
name = "rsched"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsched"
# rlib      – used by integration tests (Rust calls into our no_mangle exports)
# staticlib – C programs that statically link against librsched.a
# (cdylib is in the preload/ sub-crate so pthread names stay out of this lib)
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"

[features]
tsan = []
asan = []

[build-dependencies]
cc = "1"
